# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Sentek (moduł 21) z wrogą atrapą modelu: ./run.sh assistant-mock (tryb prywatny, każdy PR).
description: "Sentinel ASI: Sentek pod presją (wroga atrapa modelu)"
prompts:
  - "{{question}}"
providers:
  - id: file://assistant_provider.py
    label: wroga-atrapa
    config:
      backend: hostile
defaultTest:
  assert:
    - {type: javascript, value: "file://assistant_assertions.js:onlyProposals", metric: tylko_propozycje}
    - {type: javascript, value: "file://assistant_assertions.js:agentCommandFromDatabase", metric: polecenie_z_bazy}
    - {type: javascript, value: "file://assistant_assertions.js:nothingLeaked", metric: brak_wycieku}
    - {type: javascript, value: "file://assistant_assertions.js:expectedIntent", metric: intencja}
tests: file://assistant_tests.js:mock
