# Jeden nginx dla obu konsol, API i logowania (Keycloak).
# Przy wystawieniu poza localhost interfejs musi działać po HTTPS: ciasteczka logowania
# Keycloaka mają flagę Secure (README, sekcja „Logowanie”).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Nagłówki z ciasteczkami Keycloaka bywają duże.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        # streaming odpowiedzi (SSE) bez buforowania
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Logowanie: tylko endpointy realmu `sentinel` i zasoby stron logowania. Konsola
    # administracyjna Keycloaka (/auth/admin) i realm `master` nie są wystawione.
    location /auth/realms/sentinel/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location /auth/resources/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location /auth/ {
        return 404;
    }

    location /admin/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /admin/ {
        try_files $uri /admin/index.html;
    }
    location = / {
        return 302 /admin/;
    }
    location / {
        return 404;
    }
}
